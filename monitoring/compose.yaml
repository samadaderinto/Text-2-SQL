name: text-2-sql-monitoring

services:
  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - text2sql-mon-net
      - text2sql-app-net
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  vector:
    image: timberio/vector:0.49.0-debian
    command: ["--config", "/etc/vector/vector.yaml"]
    env_file:
      - ../server/.env
    volumes:
      - ../observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8686:8686"
    networks:
      - text2sql-mon-net
      - text2sql-app-net
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    env_file:
      - ../server/.env
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        export GF_SECURITY_ADMIN_USER="$${ADMIN_EMAIL:-$${GF_SECURITY_ADMIN_USER:-}}"
        export GF_SECURITY_ADMIN_PASSWORD="$${ADMIN_PASSWORD:-$${GF_SECURITY_ADMIN_PASSWORD:-}}"
        export GF_SECURITY_ADMIN_EMAIL="$${ADMIN_EMAIL:-$${GF_SECURITY_ADMIN_EMAIL:-}}"
        test -n "$${GF_SECURITY_ADMIN_USER}" || { echo "ADMIN_EMAIL is required" >&2; exit 1; }
        test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "ADMIN_PASSWORD is required" >&2; exit 1; }
        if [ -f /var/lib/grafana/grafana.db ]; then
          grafana cli --homepath /usr/share/grafana admin reset-admin-password "$${GF_SECURITY_ADMIN_PASSWORD}" >/dev/null 2>&1 || true
        fi
        exec /run.sh
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - text2sql-mon-net
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - text2sql-mon-net
      - text2sql-app-net
    depends_on:
      kafka-exporter:
        condition: service_started
      mysql-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      elasticsearch-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      blackbox-exporter:
        condition: service_started

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=0.0.0.0:9308
    ports:
      - "127.0.0.1:9308:9308"
    networks:
      - text2sql-mon-net
      - text2sql-app-net

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    env_file:
      - ../server/.env
    entrypoint:
      - sh
      - -c
    command:
      - |
        printf '[client]\nuser=%s\npassword=%s\nhost=database\nport=3306\n' "$${MYSQL_USER}" "$${MYSQL_PASSWORD}" > /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf --no-collect.slave_status
    ports:
      - "127.0.0.1:9104:9104"
    networks:
      - text2sql-mon-net
      - text2sql-app-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    command:
      - --redis.addr=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - text2sql-mon-net
      - text2sql-app-net

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
    command:
      - --es.uri=http://elasticsearch:9200
      - --es.all
      - --es.indices
    ports:
      - "127.0.0.1:9116:9114"
    networks:
      - text2sql-mon-net
      - text2sql-app-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - text2sql-mon-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - text2sql-mon-net
      - text2sql-app-net

networks:
  text2sql-mon-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  text2sql-app-net:
    external: true
    name: text-2-sql-app-net

volumes:
  loki_data:
  grafana_data:
  prometheus_data:
