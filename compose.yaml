name: text-2-sql

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./server/.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    command: >
      sh -c "(python -c 'import dj_database_url' ||
             python -m pip install 'dj-database-url>=2.2,<3.0') &&
             python manage.py migrate &&
             python manage.py reindex_search &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      CACHE_LOCATION: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=8)",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    command: >
      sh -c "(python -c 'import dj_database_url' ||
             python -m pip install 'dj-database-url>=2.2,<3.0') &&
             python manage.py run_queue_worker"
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      CACHE_LOCATION: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./server:/app
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  client:
    build:
      context: ./client
    env_file:
      - ./client/.env
    command: npm run dev -- --host 0.0.0.0 --port 4174
    ports:
      - "4174:4174"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:9092
    ports:
      - "127.0.0.1:9092:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--brokers", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  client_node_modules:
  elasticsearch_data:
  mysql_data:
  redis_data:
  kafka_data:
