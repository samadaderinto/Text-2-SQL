services:
  - type: web
    name: text-2-sql-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    autoDeploy: false
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: text-2-sql-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: text-2-sql-api
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: text-2-sql-frontend
          property: host
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        value: Admin
      - key: ADMIN_LAST_NAME
        sync: false
      - key: DEPLOY_ENV
        value: production
      - key: KAFKA_LOGGING_ENABLED
        value: "false"
      - key: CACHE_BACKEND
        value: django_redis.cache.RedisCache
      - key: CACHE_LOCATION
        sync: false
      - key: CACHE_KEY_PREFIX
        value: audql
      - key: CACHE_IGNORE_EXCEPTIONS
        value: "false"
      - key: DATA_CACHE_TIMEOUT
        value: "300"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_TLS
        value: "false"
      - key: EMAIL_USE_SSL
        value: "true"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: FCM_ENABLED
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_FILE
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

  - type: worker
    name: text-2-sql-worker
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    autoDeploy: false
    startCommand: python manage.py run_queue_worker
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: text-2-sql-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DEPLOY_ENV
        value: production
      - key: KAFKA_LOGGING_ENABLED
        value: "false"
      - key: CACHE_BACKEND
        value: django_redis.cache.RedisCache
      - key: CACHE_LOCATION
        sync: false
      - key: CACHE_KEY_PREFIX
        value: audql
      - key: CACHE_IGNORE_EXCEPTIONS
        value: "false"
      - key: DATA_CACHE_TIMEOUT
        value: "300"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_TLS
        value: "false"
      - key: EMAIL_USE_SSL
        value: "true"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: FCM_ENABLED
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_FILE
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: text-2-sql-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: text-2-sql-api
          property: host
      - key: VITE_ERROR_REPORTING_ENABLED
        value: "true"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false

databases:
  - name: text-2-sql-postgres
    plan: free
    databaseName: text2sql
    user: text2sql
    ipAllowList: []
