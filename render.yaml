services:
  - type: web
    name: text-2-sql-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    autoDeploy: false
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: text-2-sql-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: text-2-sql-api
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: text-2-sql-frontend
          property: host
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: text-2-sql-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: text-2-sql-api
          property: host

databases:
  - name: text-2-sql-postgres
    plan: free
    databaseName: text2sql
    user: text2sql
    ipAllowList: []
