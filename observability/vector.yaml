data_dir: /var/lib/vector

sources:
  audql_logs:
    type: kafka
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
    group_id: audql-vector-logs
    topics:
      - "${KAFKA_LOG_TOPIC:-audql.logs}"
    decoding:
      codec: json
    auto_offset_reset: earliest

  docker_logs:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock

transforms:
  normalize_app_logs:
    type: remap
    inputs:
      - audql_logs
    source: |
      .event_type = if exists(.event_type) { .event_type } else { "app_log" }

  normalize_docker_logs:
    type: remap
    inputs:
      - docker_logs
    source: |
      .source = "container"
      .service = .container_name
      .environment = get_env_var("DEPLOY_ENV") ?? "local"
      .level = "info"
      .event_type = "container_log"

sinks:
  loki_app:
    type: loki
    inputs:
      - normalize_app_logs
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      service: "{{ service }}"
      environment: "{{ environment }}"
      level: "{{ level }}"
    out_of_order_action: accept

  loki_containers:
    type: loki
    inputs:
      - normalize_docker_logs
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      source: "{{ source }}"
      container: "{{ container_name }}"
      image: "{{ image }}"
      stream: "{{ stream }}"
      environment: "{{ environment }}"
    out_of_order_action: accept
