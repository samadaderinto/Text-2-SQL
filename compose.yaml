services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_NAME:-text2sql_db}"
      MYSQL_USER: "${MYSQL_USER:-text2sql_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-dev-only-db-password-change-me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-dev-only-root-password-change-me}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py reindex_search &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "true"
      SECRET_KEY: "${SECRET_KEY:-dev-only-secret-key-change-me}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-dev-placeholder}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:4174}"
      MYSQL_NAME: "${MYSQL_NAME:-text2sql_db}"
      MYSQL_USER: "${MYSQL_USER:-text2sql_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-dev-only-db-password-change-me}"
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST:-elasticsearch}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT:-9200}"
      ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
  client:
    build:
      context: ./client
    command: npm run dev -- --host 0.0.0.0 --port 4174
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "4174:4174"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  client_node_modules:
  elasticsearch_data:
  mysql_data:
