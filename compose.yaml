name: text-2-sql-app

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./server/.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  text2sql-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    command: >
      sh -c "(python -c 'import dj_database_url' ||
             python -m pip install 'dj-database-url>=2.2,<3.0') &&
             python manage.py migrate &&
             (python manage.py create_prod_admin || true) &&
             python manage.py reindex_search &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,text2sql-server,server
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      CACHE_LOCATION: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8001:8000"
    volumes:
      - ./server:/app
    networks:
      - app-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=8)",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    command: >
      sh -c "(python -c 'import dj_database_url' ||
             python -m pip install 'dj-database-url>=2.2,<3.0') &&
             python manage.py run_queue_worker"
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      CACHE_LOCATION: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./server:/app
    networks:
      - app-net
    depends_on:
      text2sql-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 60s

  kafka:
    image: redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:9093
    ports:
      - "127.0.0.1:9093:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  app-net:
    name: text-2-sql-app-net
    external: true

volumes:
  elasticsearch_data:
  mysql_data:
  redis_data:
  kafka_data:
