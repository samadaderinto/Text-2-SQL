services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_NAME:-text2sql_db}"
      MYSQL_USER: "${MYSQL_USER:-text2sql_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-dev-only-db-password-change-me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-dev-only-root-password-change-me}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py reindex_search &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "true"
      SECRET_KEY: "${SECRET_KEY:-dev-only-secret-key-change-me}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-dev-placeholder}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:4174}"
      MYSQL_NAME: "${MYSQL_NAME:-text2sql_db}"
      MYSQL_USER: "${MYSQL_USER:-text2sql_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-dev-only-db-password-change-me}"
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST:-elasticsearch}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT:-9200}"
      ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
      DEPLOY_ENV: "${DEPLOY_ENV:-local}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_LOG_TOPIC: "${KAFKA_LOG_TOPIC:-audql.logs}"
      KAFKA_JOB_TOPIC: "${KAFKA_JOB_TOPIC:-audql.jobs}"
      KAFKA_JOB_GROUP_ID: "${KAFKA_JOB_GROUP_ID:-audql-workers}"
      KAFKA_LOGGING_ENABLED: "${KAFKA_LOGGING_ENABLED:-true}"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=8)",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: python manage.py run_queue_worker
    restart: unless-stopped
    environment:
      DEBUG: "true"
      SECRET_KEY: "${SECRET_KEY:-dev-only-secret-key-change-me}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-dev-placeholder}"
      MYSQL_NAME: "${MYSQL_NAME:-text2sql_db}"
      MYSQL_USER: "${MYSQL_USER:-text2sql_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-dev-only-db-password-change-me}"
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST:-elasticsearch}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT:-9200}"
      ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_JOB_TOPIC: "${KAFKA_JOB_TOPIC:-audql.jobs}"
      KAFKA_JOB_GROUP_ID: "${KAFKA_JOB_GROUP_ID:-audql-workers}"
    volumes:
      - ./server:/app
    depends_on:
      server:
        condition: service_healthy
      kafka:
        condition: service_healthy
  client:
    build:
      context: ./client
    command: npm run dev -- --host 0.0.0.0 --port 4174
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
      VITE_ERROR_REPORTING_ENABLED: "${VITE_ERROR_REPORTING_ENABLED:-true}"
    ports:
      - "4174:4174"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:9092
    ports:
      - "127.0.0.1:9092:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--brokers", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  vector:
    image: timberio/vector:0.49.0-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      KAFKA_LOG_TOPIC: "${KAFKA_LOG_TOPIC:-audql.logs}"
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-local}"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_started

volumes:
  client_node_modules:
  elasticsearch_data:
  mysql_data:
  kafka_data:
  loki_data:
  grafana_data:
