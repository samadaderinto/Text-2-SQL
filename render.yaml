services:
  - type: web
    name: text-2-sql-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    autoDeploy: false
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: text-2-sql-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: text-2-sql-api
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: text-2-sql-frontend
          property: host
      - key: OPENAI_API_KEY
        sync: false
      - key: DEPLOY_ENV
        value: production
      - key: KAFKA_LOGGING_ENABLED
        value: "false"
      - key: CACHE_BACKEND
        value: django_redis.cache.RedisCache
      - key: CACHE_LOCATION
        sync: false
      - key: CACHE_KEY_PREFIX
        value: audql
      - key: CACHE_IGNORE_EXCEPTIONS
        value: "false"
      - key: DATA_CACHE_TIMEOUT
        value: "300"
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: web
    name: text-2-sql-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: text-2-sql-api
          property: host
      - key: VITE_ERROR_REPORTING_ENABLED
        value: "true"

databases:
  - name: text-2-sql-postgres
    plan: free
    databaseName: text2sql
    user: text2sql
    ipAllowList: []
