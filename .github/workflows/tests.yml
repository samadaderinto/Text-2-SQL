name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_ERROR_REPORTING_ENABLED: "false"
          VITE_FIREBASE_API_KEY: ""
          VITE_FIREBASE_AUTH_DOMAIN: ""
          VITE_FIREBASE_PROJECT_ID: ""
          VITE_FIREBASE_MESSAGING_SENDER_ID: ""
          VITE_FIREBASE_APP_ID: ""
          VITE_FIREBASE_VAPID_KEY: ""
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: text2sql
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d text2sql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DEBUG: "true"
      SECRET_KEY: ci-secret-key-for-tests-only
      OPENAI_API_KEY: ci-placeholder
      DATABASE_URL: postgresql://ci:ci-postgres-password@127.0.0.1:5432/text2sql
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      FCM_ENABLED: "false"
      FCM_PROJECT_ID: ""
      FCM_SERVICE_ACCOUNT_FILE: ""
      FCM_SERVICE_ACCOUNT_JSON: ""
      ELASTICSEARCH_HOST: localhost
      ELASTICSEARCH_PORT: "9200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-test.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Verify PostgreSQL migrations
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: pytest

  report-pr-status:
    name: Report PR check status
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.frontend.result == 'failure' ||
       needs.backend.result == 'failure' ||
       (needs.frontend.result == 'success' && needs.backend.result == 'success'))
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add failure summary to workflow run
        if: needs.frontend.result == 'failure' || needs.backend.result == 'failure'
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## PR checks need attention"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Frontend tests and build | $FRONTEND_RESULT |"
            echo "| Backend tests | $BACKEND_RESULT |"
            echo
            echo "Review the failed job logs: [$RUN_URL]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR incident summary
        uses: actions/github-script@v7
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- audql-pr-check-failure -->';
            const failed =
              process.env.FRONTEND_RESULT === 'failure' ||
              process.env.BACKEND_RESULT === 'failure';
            const body = failed
              ? [
                  marker,
                  '## PR checks need attention',
                  '',
                  `- Frontend tests and build: **${process.env.FRONTEND_RESULT}**`,
                  `- Backend tests: **${process.env.BACKEND_RESULT}**`,
                  '',
                  `[Review the failed job logs](${process.env.RUN_URL}).`,
                ].join('\n')
              : [
                  marker,
                  '## PR checks recovered',
                  '',
                  'Frontend tests/build and backend tests are passing again.',
                  '',
                  `[View the successful workflow run](${process.env.RUN_URL}).`,
                ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find((comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else if (failed) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Could not post the PR summary (the run summary is still available): ${error.message}`);
            }
